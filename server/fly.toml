# fly.toml for server-fragrant-rain-8971
app = 'server-fragrant-rain-8971'
primary_region = 'sin'

[build]

[env]
  PORT = "3000"
  ANNOUNCED_IP = "66.241.124.241"
  WEBRTC_SERVER_PORT = "10000"

# mediasoup workers must stay alive between calls — never auto-stop
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

# Single TCP port for mediasoup WebRtcServer — all transports share this port
[[services]]
  protocol = "tcp"
  internal_port = 10000
  [[services.ports]]
    port = 10000
