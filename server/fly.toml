# fly.toml for server-fragrant-rain-8971
app = 'server-fragrant-rain-8971'
primary_region = 'sin'

[build]

[env]
  PORT = "3000"
  MEDIASOUP_MIN_PORT = "10000"
  MEDIASOUP_MAX_PORT = "10009"

# mediasoup workers must stay alive between calls — never auto-stop
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

# UDP ports for mediasoup RTP (one entry per port)
[[services]]
  protocol = "udp"
  internal_port = 10000
  [[services.ports]]
    port = 10000

[[services]]
  protocol = "udp"
  internal_port = 10001
  [[services.ports]]
    port = 10001

[[services]]
  protocol = "udp"
  internal_port = 10002
  [[services.ports]]
    port = 10002

[[services]]
  protocol = "udp"
  internal_port = 10003
  [[services.ports]]
    port = 10003

[[services]]
  protocol = "udp"
  internal_port = 10004
  [[services.ports]]
    port = 10004

[[services]]
  protocol = "udp"
  internal_port = 10005
  [[services.ports]]
    port = 10005

[[services]]
  protocol = "udp"
  internal_port = 10006
  [[services.ports]]
